services:
  # PostgreSQL Database Container
  postgres:
    image: postgres:15-alpine
    container_name: allwhatspy-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-allwhatspy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no ambiente}
      POSTGRES_DB: ${POSTGRES_DB:-allwhatspy_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - default

  # Next.js Web App Container
  allwhatspy-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: allwhatspy-web:latest
    container_name: allwhatspy-web
    restart: always
    depends_on:
      - postgres
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-allwhatspy}:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no ambiente}@postgres:5432/${POSTGRES_DB:-allwhatspy_db}?schema=public
      - ADMIN_INITIAL_EMAIL=${ADMIN_INITIAL_EMAIL:-admin@allwhatspy.com}
      - ADMIN_INITIAL_PASSWORD=${ADMIN_INITIAL_PASSWORD:?Defina ADMIN_INITIAL_PASSWORD com 12 ou mais caracteres}
      - SECRET_ENCRYPTION_KEY=${SECRET_ENCRYPTION_KEY:?Defina SECRET_ENCRYPTION_KEY com 32 bytes em base64}
      - EVOLUTION_ALLOWED_HOSTS=${EVOLUTION_ALLOWED_HOSTS:-}
      - EVOLUTION_API_URL=${EVOLUTION_API_URL:-}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY:-}
      - EVOLUTION_INSTANCE_NAME=${EVOLUTION_INSTANCE_NAME:-}
      - WEBHOOK_ALLOWED_HOSTS=${WEBHOOK_ALLOWED_HOSTS:-}
      - SMTP_ALLOWED_HOSTS=${SMTP_ALLOWED_HOSTS:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-AllWhatsPy}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-}
    networks:
      - default
      - Impulsinet
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=Impulsinet"
        - "traefik.http.routers.allwhatspy.rule=Host(`painel.anexohub.com.br`)"
        - "traefik.http.routers.allwhatspy.entrypoints=websecure"
        - "traefik.http.routers.allwhatspy.tls.certresolver=letsencrypt"
        - "traefik.http.services.allwhatspy.loadbalancer.server.port=3000"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=Impulsinet"
      - "traefik.http.routers.allwhatspy.rule=Host(`painel.anexohub.com.br`)"
      - "traefik.http.routers.allwhatspy.entrypoints=websecure"
      - "traefik.http.routers.allwhatspy.tls.certresolver=letsencrypt"
      - "traefik.http.services.allwhatspy.loadbalancer.server.port=3000"

volumes:
  postgres_data:

networks:
  default:
  Impulsinet:
    external: true
